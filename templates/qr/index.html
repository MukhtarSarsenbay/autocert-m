<!doctype html>
<html>
    <head>
    	<title>Our Funky HTML Page</title>
    	<meta name="description" content="Our first page">
    	<meta name="keywords" content="html tutorial template">
    	<style>
        	.customers {
  				font-family: Arial, Helvetica, sans-serif;
            	font-size: 36px;
  				border-collapse: collapse;
  				width: 100%;
			}

			.customers td, #customers th {
  				border: 1px solid #ddd;
  				padding: 8px;
			}

			.customers tr:nth-child(even){background-color: #f2f2f2;}

			.customers tr:hover {background-color: #ddd;}

			.customers th {
  				padding-top: 12px;
  				padding-bottom: 12px;
  				text-align: left;
  				background-color: #04AA6D;
  				color: white;
			}
    	</style>
    </head>
    <body>
    	<table class="customers">
        	<body>
            	<tr>
                	<td>Локация</td>
                	<td>{{res.entity}}</td>
            	</tr>
        		<tr>
                	<td>Название ТМЦ/Инструмента</td>
                	<td>{{res.name}}</td>
            	</tr>
            	<tr>
                	<td>Бренд</td>
                	<td>{{res.brand}}</td>
            	</tr>
            	<tr>
                	<td>Модель</td>
                	<td>{{res.model}}</td>
            	</tr>
            	<tr>
                	<td>Серейний номер</td>
                	<td>{{res.serial}}</td>
            	</tr>
            	<tr>
                	<td>Срок действия поверки СИ</td>
                	{% if check %}
                		<td><span style="color: red">{{res.date}}</span></td>
					{% else %}
                		<td><span>{{res.date}}</span></td>
					{% endif %}
            	</tr>	
            	<tr>
                	<td>Документ</td>
                	<td><a href="https://cms.labauto.kz/media/{{res.document}}">скачать</a></td>
            	</tr>
            	{% for image in images %}
            		<tr>
                		<td>Фото</td>
                		<td><img src="https://cms.labauto.kz/media/{{image.image}}" width="500"/></td>
            		</tr>
            	{% endfor %}
            	
        	</body>
    	</table>
    </body>
</html>
