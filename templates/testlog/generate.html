<!DOCTYPE html>
<html>
	<head>
		<title>test</title>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
		<style>
			.wrapper {
  				position: relative;
  				width: 400px;
  				height: 200px;
  				-moz-user-select: none;
  				-webkit-user-select: none;
  				-ms-user-select: none;
  				user-select: none;
  				border: 2px solid;
  				margin-bottom: 10px;
			}
			.notice {
				position: absolute;
				left: 0;
				top: 0;
				width: 400px;
				height: 200px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: "Times New Roman", serif;
			}
		</style>
	</head>
	<body>
		<div>Запись об испытаниях № {{test_number}}</div>
    	<div id="test_id" style="display:none;">{{id}}</div>

		<div class="wrapper">
			<div class="notice">Нажмите кнопку для генерации</div>
		</div>

		<button id="generate">Сформировать документ</button>

		<script type="text/javascript">
			function getCookie(name) {
				let cookieValue = null;
				if (document.cookie && document.cookie !== '') {
					const cookies = document.cookie.split(';');
					for (let i = 0; i < cookies.length; i++) {
						const cookie = cookies[i].trim();
						if (cookie.substring(0, name.length + 1) === (name + '=')) {
							cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
							break;
						}
					}
				}
				return cookieValue;
			}

			$( document ).ready(function() {
				$("#generate").on( "click", function() {
					const id = $("#test_id").text().trim();
					let payload = { id: id };

					$.ajax({
						method: "POST",
						type: 'POST',
						url: "/api/testlog/generate/",
						headers: {'X-CSRFToken': getCookie("csrftoken")},
						cache: false,
						contentType: "application/json",
						processData: false,
						data: JSON.stringify(payload),
						success: function(result) {
							window.close()
						},
						error: function(){
							alert('Ошибка формирования. Проверьте данные и попробуйте еще раз.');
						}
					});
				})
			})
		</script>
	</body>
</html>
