services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newlabauto}
      POSTGRES_USER: ${POSTGRES_USER:-erema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loc25387}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  converter:
    image: gotenberg/gotenberg:8.32.0-libreoffice
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-auto-start=true
      - --libreoffice-restart-after=50
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      converter:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-secret-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8667,http://127.0.0.1:8667}
      DJANGO_CSRF_COOKIE_NAME: ${DJANGO_CSRF_COOKIE_NAME:-autocert_m_csrftoken}
      DJANGO_SESSION_COOKIE_NAME: ${DJANGO_SESSION_COOKIE_NAME:-autocert_m_sessionid}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-0}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-0}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-0}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-0}
      POSTGRES_DB: ${POSTGRES_DB:-newlabauto}
      POSTGRES_USER: ${POSTGRES_USER:-erema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loc25387}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PDF_CONVERTER_URL: ${PDF_CONVERTER_URL:-http://converter:3000}
      PDF_CONVERTER_TIMEOUT: ${PDF_CONVERTER_TIMEOUT:-120}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-0}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-1}
    expose:
      - "8000"
    volumes:
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/', headers={'Host':'localhost'}); urllib.request.urlopen(req, timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8667:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/app/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
