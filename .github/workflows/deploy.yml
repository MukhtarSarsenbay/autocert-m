name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kaspicert-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: GH_TOKEN,REPOSITORY
          command_timeout: 30m
          script: |
            set -eu

            cd "${{ secrets.SERVER_APP_DIR }}"

            if [ ! -d .git ]; then
              echo "SERVER_APP_DIR must point to an existing clone of this repository."
              exit 1
            fi

            git remote set-url origin "https://github.com/${REPOSITORY}.git"
            git_auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $git_auth_header" fetch --prune origin main
            unset git_auth_header GH_TOKEN
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing server .env file. Create it from .env.example before deploying."
              exit 1
            fi

            mkdir -p media postgres_data

            docker compose pull db proxy converter
            docker compose up -d --build --remove-orphans
            docker compose up -d --no-deps --force-recreate proxy
            docker compose exec -T web python manage.py test testlog cert --settings=labauto.test_settings --verbosity 1
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py ensure_testlog_creators
            docker compose exec -T web python manage.py check
            docker compose exec -T web python manage.py check_pdf_converter
            web_container_id="$(docker compose ps -q web)"
            web_health="starting"
            for _ in $(seq 1 30); do
              web_health="$(docker inspect --format '{{.State.Health.Status}}' "$web_container_id")"
              if [ "$web_health" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            if [ "$web_health" != "healthy" ]; then
              echo "Web container health is $web_health"
              exit 1
            fi

            proxy_container_id="$(docker compose ps -q proxy)"
            proxy_health="starting"
            for _ in $(seq 1 30); do
              proxy_health="$(docker inspect --format '{{.State.Health.Status}}' "$proxy_container_id")"
              if [ "$proxy_health" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            if [ "$proxy_health" != "healthy" ]; then
              echo "Proxy container health is $proxy_health"
              exit 1
            fi
            docker compose ps

            docker compose exec -T web python manage.py shell -c "from django.conf import settings; print(f'Runtime cookies: {settings.CSRF_COOKIE_NAME}, {settings.SESSION_COOKIE_NAME}')"
