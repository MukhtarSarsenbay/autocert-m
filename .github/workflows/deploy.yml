name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kaspicert-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu

            cd "${{ secrets.SERVER_APP_DIR }}"

            if [ ! -d .git ]; then
              echo "SERVER_APP_DIR must point to an existing clone of this repository."
              exit 1
            fi

            git fetch --prune origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing server .env file. Create it from .env.example before deploying."
              exit 1
            fi

            mkdir -p media postgres_data

            docker compose pull db || true
            docker compose up -d --build --remove-orphans
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py check
            docker compose exec -T web python - <<'PY'
            import sys
            import time
            import urllib.request

            url = "http://127.0.0.1:8000/"
            req = urllib.request.Request(url, headers={"Host": "localhost"})
            last_error = None

            for _ in range(30):
                try:
                    with urllib.request.urlopen(req, timeout=5) as response:
                        print(f"Health check OK: {response.status}")
                        sys.exit(0)
                except Exception as exc:
                    last_error = exc
                    time.sleep(2)

            print(f"Health check failed: {last_error}", file=sys.stderr)
            sys.exit(1)
            PY
            docker compose ps
